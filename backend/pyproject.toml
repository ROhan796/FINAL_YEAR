[project]
name = "ckgai-backend"
version = "0.1.0"
description = "AI Scientific Paper Knowledge Engine — FastAPI backend + modular CKGAI ML pipeline"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.32",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "redis>=5.0",
  "aiosqlite>=0.20",
  "numpy>=1.26",
  "orjson>=3.10",
  "structlog>=24.4",
  "tenacity>=9.0",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
# The ML plane. The API boots without these — ml/ lazy-imports torch.
ml = [
  "torch>=2.3",
  "torch-geometric>=2.6",
  "transformers>=4.44",
  "sentence-transformers>=3.0",
  "scispacy>=0.5.4",
  "datasets>=2.20",
  "accelerate>=0.33",
  "scikit-learn>=1.5",
]
graph = ["neo4j>=5.22"]
llm = ["google-genai>=1.0"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "testcontainers[postgres]>=4.6",
  "fakeredis>=2.25",
]
all = ["ckgai-backend[ml,graph,llm,dev]"]

[project.scripts]
ckgai = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["alembic/versions", "\\.venv"]

[[tool.mypy.overrides]]
module = ["torch.*", "torch_geometric.*", "transformers.*", "sentence_transformers.*", "neo4j.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
