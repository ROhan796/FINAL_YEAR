name: CKGAI CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" numpy torch scikit-learn
      - name: Run pytest
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install & build Next.js
        run: |
          npm ci
          npm run lint
          npm run build
